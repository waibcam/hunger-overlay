[package]
name = "hunger-overlay"
version = "0.1.0"
edition = "2021"
description = "Overlay du quest tracker Hunger Companion par-dessus la carte du jeu Hunger"
license = "MIT"
repository = "https://github.com/waibcam/hunger-overlay"

[[bin]]
name = "HungerOverlay"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.10", default-features = false, features = ["native-tls", "gzip"] }
native-tls = "0.2"

[dependencies.windows]
version = "0.58"
features = [
  "Foundation_Numerics",
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Input",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
